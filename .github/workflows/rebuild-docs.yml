name: Rebuild docs

on: deployment_status

permissions: {}

jobs:
  rebuild:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'better-lyrics / production'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "$DOCS_DEPLOY_HOOK_URL"
        env:
          DOCS_DEPLOY_HOOK_URL: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
